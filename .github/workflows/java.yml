name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  formatting:
    runs-on: ubuntu-latest
    name: Java Build and Test Job

    # GitHub token permissions
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up JDK 26
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: 26
      - name: Build and Test
        working-directory: ./backend
        run: ./gradlew build
